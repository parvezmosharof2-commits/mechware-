<title>MECHWARE Buyer Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dense, table-first parts catalogue (McMaster / DigiKey register) inside a slim interview bar; console screens swap to a staff shell with a side nav. */
:root {
  --bg: #F3F6FA;
  --surface: #FFFFFF;
  --sunken: #EAF0F6;
  --ink: #0F172A;
  --ink-2: #3E4C63;
  --ink-3: #5A687D;
  --line: #D5DEE9;
  --line-strong: #A9B7CA;
  --navy: #0F3E7D;
  --on-navy: #FFFFFF;
  --navy-ink: #0F3E7D;
  --navy-wash: #E6EEF9;
  --teal: #00A8B5;
  --teal-ink: #00707D;
  --teal-wash: #E0F6F8;
  --on-teal: #03282C;
  --focus: #00C3D9;
  --chrome: #0B2A55;
  --on-chrome: #F1F6FD;
  --chrome-2: #1A4380;
  --ok: #11703A; --ok-bg: #E3F4E9;
  --warn: #8A5300; --warn-bg: #FCF0D4;
  --bad: #B42318; --bad-bg: #FDE7E4;
  --info: #0B5E7A; --info-bg: #E2F2F7;

  --f-ui: "Inter", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-bn: "Hind Siliguri", "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A111E; --surface: #101A2C; --sunken: #0C1524; --ink: #E6EDF7; --ink-2: #B3C0D2; --ink-3: #94A3B8;
    --line: #22324C; --line-strong: #3A4F72; --navy: #2E6BC1; --on-navy: #FFFFFF; --navy-ink: #8EB9F2; --navy-wash: #142640;
    --teal: #1FB9C5; --teal-ink: #5ED2DB; --teal-wash: #0E2A30; --on-teal: #03282C; --focus: #38E3F5;
    --chrome: #060C18; --on-chrome: #E6EDF7; --chrome-2: #1A2B47;
    --ok: #63CF8F; --ok-bg: #11301F; --warn: #F2C25B; --warn-bg: #33270D; --bad: #F4897F; --bad-bg: #3A1714; --info: #7CCFE6; --info-bg: #0D2833;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A111E; --surface: #101A2C; --sunken: #0C1524; --ink: #E6EDF7; --ink-2: #B3C0D2; --ink-3: #94A3B8;
  --line: #22324C; --line-strong: #3A4F72; --navy: #2E6BC1; --on-navy: #FFFFFF; --navy-ink: #8EB9F2; --navy-wash: #142640;
  --teal: #1FB9C5; --teal-ink: #5ED2DB; --teal-wash: #0E2A30; --on-teal: #03282C; --focus: #38E3F5;
  --chrome: #060C18; --on-chrome: #E6EDF7; --chrome-2: #1A2B47;
  --ok: #63CF8F; --ok-bg: #11301F; --warn: #F2C25B; --warn-bg: #33270D; --bad: #F4897F; --bad-bg: #3A1714; --info: #7CCFE6; --info-bg: #0D2833;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
html[lang="bn"] body { font-family: var(--f-bn); line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
h1, h2, h3 { margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 22px; line-height: 1.25; font-weight: 700; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
a { color: var(--navy-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.pn { font-family: var(--f-mono); font-weight: 600; letter-spacing: -0.01em; word-break: break-all; }
.muted { color: var(--ink-2); }
.subtle { color: var(--ink-3); font-size: 12px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
html[lang="bn"] .label { letter-spacing: 0; text-transform: none; font-size: 12px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* Interview bar */
.proto-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); color: var(--on-chrome); }
.proto-bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.proto-tag { font-size: 12px; font-weight: 600; opacity: 0.9; white-space: nowrap; }
.proto-tag b { font-weight: 700; letter-spacing: 0.08em; }
.proto-bar select, .proto-bar .pbtn { height: 32px; border-radius: var(--r); border: 1px solid var(--chrome-2); background: var(--chrome-2); color: var(--on-chrome); padding: 0 10px; }
.proto-bar select { min-width: 0; flex: 1 1 200px; max-width: 320px; }
.proto-bar .pbtn { cursor: pointer; font-weight: 600; font-size: 13px; }
.proto-bar .pbtn[aria-pressed="true"] { background: var(--on-chrome); color: var(--chrome); border-color: var(--on-chrome); }
.seg { display: inline-flex; }
.seg .pbtn:first-child { border-radius: var(--r) 0 0 var(--r); }
.seg .pbtn:last-child { border-radius: 0 var(--r) var(--r) 0; }
.proto-spacer { flex: 1 1 0; }
@media (max-width: 520px) { .proto-tag { display: none; } }
.notes { background: var(--teal-wash); border-bottom: 1px solid var(--line); }
.notes .wrap { padding-block: 10px; }
.notes ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--navy-ink); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-accent { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.btn-danger { color: var(--bad); border-color: var(--bad); }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn-link { background: none; border: 0; padding: 0; color: var(--navy-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0; width: 100%; }
textarea.input { height: auto; padding: 10px; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; resize: vertical; }
.qty { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--navy); }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel-flush { padding: 0; overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.callout { border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.callout b { font-weight: 700; }
.callout.warn { background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn); }
.callout.info { background: var(--info-bg); color: var(--ink); border-left: 4px solid var(--info); }
.callout.ok { background: var(--ok-bg); color: var(--ink); border-left: 4px solid var(--ok); }
.callout.bad { background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.neutral { background: var(--sunken); color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.chip .ct { font-variant-numeric: tabular-nums; opacity: 0.8; }

/* Tables */
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); background: var(--sunken); white-space: nowrap; }
html[lang="bn"] .tbl th { text-transform: none; letter-spacing: 0; font-size: 12px; }
.tbl th.num { text-align: right; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:hover { background: var(--sunken); }
.tbl tr.sel { background: var(--navy-wash); }
.tbl tfoot td { font-weight: 700; border-bottom: 0; }
.tbl .cell-title { font-weight: 600; }
.tbl .cell-sub { font-size: 12px; color: var(--ink-2); }
.breaks { display: grid; grid-template-columns: auto auto; gap: 0 10px; font-size: 12px; justify-content: end; }
.breaks span:nth-child(odd) { color: var(--ink-3); text-align: right; }
.breaks span:nth-child(even) { text-align: right; font-weight: 600; }
.clickrow { cursor: pointer; }

@media (max-width: 760px) {
  .rt thead { display: none; }
  .rt, .rt tbody, .rt tfoot { display: block; }
  .rt tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 12px; border-bottom: 1px solid var(--line); }
  .rt td { display: block; border: 0; padding: 0; min-width: 0; text-align: left; }
  .rt td.num { text-align: left; white-space: normal; }
  .rt td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); }
  .rt td.full { grid-column: 1 / -1; }
  .rt td.hide-m { display: none; }
  .rt .breaks { justify-content: start; }
  .rt tfoot tr { display: flex; justify-content: space-between; }
}

/* Storefront chrome */
.store-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.store-head .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.logo { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 800; font-size: 18px; letter-spacing: 0.08em; color: var(--navy-ink); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
.logo i { font-style: normal; width: 10px; height: 10px; background: var(--teal); display: inline-block; transform: rotate(45deg); border-radius: 2px; }
.logo small { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-3); }
.search { display: flex; flex: 1 1 320px; min-width: 0; order: 3; }
.search input { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line-strong); border-right: 0; border-radius: var(--r) 0 0 var(--r); padding: 0 12px; background: var(--surface); }
.search button { border-radius: 0 var(--r) var(--r) 0; }
.acct { display: flex; align-items: center; gap: 12px; margin-left: auto; order: 2; font-size: 13px; }
.acct .who { text-align: right; line-height: 1.25; }
.acct .who b { display: block; }
.cart-btn { position: relative; }
.cart-btn .badge { background: var(--teal); color: var(--on-teal); border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: 700; }
.catnav { border-top: 1px solid var(--line); background: var(--surface); }
.catnav .wrap { display: flex; gap: 18px; overflow-x: auto; padding-block: 8px; font-size: 13px; font-weight: 600; scrollbar-width: none; }
.catnav button { background: none; border: 0; padding: 2px 0; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.catnav button:hover { color: var(--navy-ink); }
@media (min-width: 900px) { .search { order: 2; } .acct { order: 3; margin-left: 0; } }
@media (max-width: 520px) { .acct .who { display: none; } }

.page { padding-block: 18px 48px; display: flex; flex-direction: column; gap: 16px; }
.crumbs { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--navy-ink); cursor: pointer; font-size: 12px; }
.title-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }

/* Home */
.hero { background: var(--navy-wash); border-bottom: 1px solid var(--line); }
.hero .wrap { padding-block: 22px; display: grid; gap: 12px; }
.hero h1 { font-size: 24px; }
.bigsearch { display: flex; gap: 8px; flex-wrap: wrap; }
.bigsearch input { flex: 1 1 280px; min-width: 0; height: 46px; font-size: 16px; padding: 0 14px; border: 2px solid var(--navy); border-radius: var(--r); background: var(--surface); font-family: var(--f-mono); }
.bigsearch .btn { min-height: 46px; padding: 0 22px; font-size: 14px; }
.trust { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.trust div { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.trust b { display: block; font-size: 13px; }
.trust span { font-size: 12px; color: var(--ink-2); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cat-head button { background: none; border: 0; padding: 0; font-weight: 700; font-size: 14px; color: var(--navy-ink); cursor: pointer; text-align: left; }
.cat ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.cat li button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2); text-align: left; }
.cat li button:hover { color: var(--navy-ink); text-decoration: underline; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* PLP */
.plp { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.filters { display: flex; flex-direction: column; gap: 14px; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup .check { font-size: 13px; justify-content: space-between; }
.fgroup .check span:first-of-type { flex: 1; }
.filter-toggle { display: none; }
@media (max-width: 960px) {
  .plp { grid-template-columns: minmax(0, 1fr); }
  .filter-toggle { display: inline-flex; }
  .filters-wrap { display: none; }
  .filters-wrap.open { display: block; }
}

/* PDP */
.pdp { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.pdp-id { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; align-items: start; }
.pdp-id h1 { font-family: var(--f-mono); font-size: 26px; letter-spacing: -0.02em; word-break: break-all; }
.drawing { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.drawing svg { width: 82%; height: auto; }
.specs { display: grid; grid-template-columns: minmax(140px, 0.9fr) minmax(0, 1.4fr); font-size: 13px; }
.specs div { padding: 7px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.specs div:nth-child(odd) { color: var(--ink-2); background: var(--sunken); }
.buybox { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 14px; }
.price-big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.doc { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--surface); font-size: 13px; min-width: 0; }
.doc .ext { font-family: var(--f-mono); font-size: 10px; font-weight: 700; background: var(--navy-wash); color: var(--navy-ink); padding: 3px 5px; border-radius: 3px; }
@media (max-width: 1000px) { .pdp { grid-template-columns: minmax(0, 1fr); } .buybox { position: static; } }
@media (max-width: 560px) { .pdp-id { grid-template-columns: minmax(0, 1fr); } .pdp-id .drawing { max-width: 200px; } .pdp-id h1 { font-size: 22px; } }

/* Checkout / cart */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.summary { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 10px; }
.sumrow { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.sumrow.total { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line-strong); padding-top: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; background: var(--surface); }
.choice input { margin-top: 3px; accent-color: var(--navy); }
.choice.on { border-color: var(--navy-ink); box-shadow: inset 0 0 0 1px var(--navy-ink); background: var(--navy-wash); }
.choice.off { opacity: 0.6; cursor: not-allowed; }
.choices { display: grid; gap: 8px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.steps span.on { color: var(--navy-ink); }
.split.qo { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
@media (max-width: 1000px) { .split, .split.qo { grid-template-columns: minmax(0, 1fr); } .summary { position: static; } }

/* Quote */
.qmeta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.qmeta div { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.qmeta b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.countdown { color: var(--warn); }
.versions { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.versions div { display: flex; gap: 10px; justify-content: space-between; }

/* Approvals */
.inbox { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
.req { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; border-left: 4px solid transparent; width: 100%; border-top: 0; border-right: 0; }
.req.sel { border-left-color: var(--navy); background: var(--navy-wash); }
.req .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.inbox.pl { grid-template-columns: 280px minmax(0, 1fr); }
@media (max-width: 900px) { .inbox, .inbox.pl { grid-template-columns: minmax(0, 1fr); } }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.kpi:hover { border-color: var(--navy-ink); }
.kpi b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }

function plpRows() {
  var f = S.filters;
  function anyOn(o) { for (var k in o) if (o[k]) return true; return false; }
  return PLC.filter(function (sku) {
    var p = P[sku];
    if (anyOn(f.mfr) && !f.mfr[p.mfr]) return false;
    if (anyOn(f.supply) && !f.supply[p.supply]) return false;
    if (anyOn(f.comms) && !p.comms.some(function (c) { return f.comms[c]; })) return false;
    if (anyOn(f.di)) {
      var band = p.di <= 8 ? 'le8' : p.di <= 16 ? '9to16' : 'gt16';
      if (!f.di[band]) return false;
    }
    if (f.instock && stockOf(sku) === 0) return false;
    return true;
  });
}

function norm(s) { return s.toUpperCase().replace(/\s+/g, ' ').trim(); }
function findSku(raw) { var n = norm(raw); for (var k in P) if (norm(k) === n) return k; return null; }
/* Linear scan, no backtracking regex: trailing digits are the quantity when a tab, comma, semicolon or space separates them. */
function splitQty(line) {
  var end = line.length;
  while (end > 0 && line.charCodeAt(end - 1) >= 48 && line.charCodeAt(end - 1) <= 57) end--;
  var digits = line.slice(end), sep = end;
  while (sep > 0 && ' \t,;'.indexOf(line.charAt(sep - 1)) >= 0) sep--;
  if (!digits || sep === end || sep === 0) return [line, 1];
  return [line.slice(0, sep), parseInt(digits.slice(0, 7), 10) || 1];
}
function parseQuick(text) {
  return text.split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean).map(function (line) {
    var sp = splitQty(line), raw = sp[0], qty = sp[1];
    var sku = findSku(raw);
    if (!sku) return { raw: raw, qty: qty, st: 'missing' };
    var p = P[sku];
    if (p.discontinued) return { raw: raw, sku: sku, qty: qty, st: 'disc', succ: p.discontinued };
    var adj = qty;
    if (p.pack > 1 && qty % p.pack) adj = Math.ceil(qty / p.pack) * p.pack;
    var st = adj !== qty ? 'pack' : 'ok';
    if (stockOf(sku) === 0) st = 'back';
    else if (adj > stockOf(sku)) st = 'partial';
    return { raw: raw, sku: sku, qty: qty, adj: adj, st: st, price: unitPrice(sku, adj) };
  });
}

  'home': [['Light or Glass: which look is easier to work in all day?', 'লাইট না গ্লাস: সারাদিন কাজ করতে কোনটায় আরাম?'], ['How do you start a purchase today: part number, brand, or a list from the plant?', 'আজ কেনাকাটা কীভাবে শুরু করেন: পার্ট নম্বর, ব্র্যান্ড, নাকি প্ল্যান্টের তালিকা থেকে?'], ['Which of the four facts in the trust strip matters most before you buy from a new supplier?', 'নতুন সাপ্লায়ার থেকে কেনার আগে ট্রাস্ট স্ট্রিপের চারটি তথ্যের কোনটা সবচেয়ে জরুরি?']],
  'products': [['Which columns do you need to compare PLCs? Which can go?', 'PLC তুলনা করতে কোন কলামগুলো লাগে? কোনগুলো বাদ দেওয়া যায়?'], ['Is the price-by-quantity table clear without explanation?', 'পরিমাণভেদে দামের টেবিল কোনো ব্যাখ্যা ছাড়াই বোঝা যায়?']],
  'product': [['What do you check before you trust a part number: datasheet, stock, warranty, origin?', 'পার্ট নম্বরে ভরসা করার আগে কী দেখেন: ডেটাশিট, স্টক, ওয়ারেন্টি, উৎস দেশ?'], ['When do you add to cart, and when do you ask for a quotation?', 'কখন কার্টে যোগ করেন, আর কখন কোটেশন চান?']],
  'quick-order': [['Where does your parts list come from today: Excel, email, WhatsApp, paper?', 'আপনার পার্টের তালিকা আজ কোথা থেকে আসে: Excel, ইমেইল, WhatsApp, কাগজ?'], ['What should happen with a discontinued part number?', 'উৎপাদন বন্ধ হওয়া পার্ট নম্বর এলে কী হওয়া উচিত?']],
  'cart': [['Do you assign a cost centre per order or per line?', 'কস্ট সেন্টার কি পুরো অর্ডারে দেন, নাকি প্রতি লাইনে?'], ['Who approves, and above what amount?', 'কে অনুমোদন দেন, আর কত টাকার বেশি হলে?']],
  'checkout': [['Which payment methods does your accounts team actually use with suppliers?', 'আপনার হিসাব বিভাগ সাপ্লায়ারকে আসলে কোন পদ্ধতিতে টাকা দেয়?'], ['Do you deduct VAT at source? Who issues Mushak-6.6?', 'আপনারা কি উৎসে VAT কাটেন? মূসক-৬.৬ কে দেন?']],
  'quote': [['How many days should a quotation stay valid?', 'কোটেশনের মেয়াদ কত দিন হওয়া উচিত?'], ['Do you compare versions of a quotation? What changes most often?', 'কোটেশনের ভার্সন কি মিলিয়ে দেখেন? সবচেয়ে বেশি কী বদলায়?']],
  'approvals': [['What does the approver need to see to decide in under a minute?', 'এক মিনিটের মধ্যে সিদ্ধান্ত নিতে অনুমোদনকারীর কী দেখা দরকার?'], ['Do approvals happen on the phone? Through email, SMS or the app?', 'অনুমোদন কি ফোনে হয়? ইমেইল, SMS না অ্যাপে?']],
  'company': [['Which number do you report to management each month?', 'প্রতি মাসে ম্যানেজমেন্টকে কোন সংখ্যাটা জানান?'], ['Is a budget per cost centre real in your company, or only on paper?', 'কস্ট সেন্টারভিত্তিক বাজেট কি আপনার কোম্পানিতে সত্যিই মানা হয়, নাকি শুধু কাগজে?']],
  'invoice': [['Does this Mushak-6.3 match what your auditor expects?', 'এই মূসক-৬.৩ কি আপনার অডিটরের প্রত্যাশার সাথে মেলে?'], ['Do you need the invoice in English as well?', 'ইনভয়েস কি ইংরেজিতেও লাগবে?']],
  'console-orders': [['(Staff) Which states do you work from each morning?', '(স্টাফ) প্রতিদিন সকালে কোন অবস্থার অর্ডার থেকে কাজ শুরু করেন?'], ['(Staff) What do customers call to ask about most often?', '(স্টাফ) গ্রাহক সবচেয়ে বেশি কী জানতে ফোন করেন?']],
  'console-prices': [['(Owner) Who should be allowed to approve a company price list?', '(মালিক) কোম্পানির প্রাইস লিস্ট অনুমোদনের অধিকার কার থাকা উচিত?'], ['(Owner) Is 8% the right margin floor? Should it differ by brand?', '(মালিক) ৮% ন্যূনতম মার্জিন কি ঠিক? ব্র্যান্ডভেদে কি আলাদা হওয়া উচিত?']]
};
var notesOpen = false;

/* ---------- render ---------- */
var app = document.getElementById('app');
var sel = document.getElementById('screen-select');
function idx(id) { for (var i = 0; i < SCREENS.length; i++) if (SCREENS[i].id === id) return i; return 0; }
function renderChrome() {
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-skin', skin);
  document.querySelectorAll('[data-skin-pick]').forEach(function (b) {
    var v = b.getAttribute('data-skin-pick');
    b.setAttribute('aria-pressed', String(v === skin));
    b.textContent = v === 'glass' ? L('Glass', 'গ্লাস') : L('Light', 'লাইট');
  });
  sel.innerHTML = SCREENS.map(function (s, i) { return '<option value="' + s.id + '"' + (s.id === current ? ' selected' : '') + '>' + dg(i + 1) + ' · ' + L(s.en, s.bn) + '</option>'; }).join('');
  document.getElementById('proto-label').textContent = L('Prototype · sample data', 'প্রোটোটাইপ · নমুনা ডেটা');
  var nb = document.getElementById('notes-btn');
  nb.textContent = L('Interview notes', 'সাক্ষাৎকারের নোট');
  nb.setAttribute('aria-pressed', String(notesOpen));
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  document.getElementById('prev-btn').disabled = idx(current) === 0;
  document.getElementById('next-btn').disabled = idx(current) === SCREENS.length - 1;
  var notes = document.getElementById('notes');
  notes.hidden = !notesOpen;
  if (notesOpen) notes.innerHTML = '<div class="wrap"><span class="label">' + L('Ask the buyer on this screen', 'এই স্ক্রিনে ক্রেতাকে জিজ্ঞেস করুন') + '</span><ol>' + NOTES[current].map(function (q) { return '<li>' + L(q[0], q[1]) + '</li>'; }).join('') + '</ol></div>';
  document.title = 'MECHWARE · ' + L(SCREENS[idx(current)].en, SCREENS[idx(current)].bn);
}
function render() {
  var fid = document.activeElement && document.activeElement.id;
  renderChrome();
  var view = VIEWS.get(current) || vHome;
  app.innerHTML = view();
  if (fid) { var el = document.getElementById(fid); if (el && app.contains(el)) el.focus({ preventScroll: true }); }
}
function go(id) {
  if (!VIEWS.has(id)) id = 'home';
  if (location.hash.slice(1) !== id) { location.hash = id; return; }
  current = id; render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); current = VIEWS.has(id) ? id : 'home'; render(); window.scrollTo(0, 0); });

var toastTimer;
function toast(msg) {
  var live = document.getElementById('toast-live');
  var box = document.createElement('div');
  box.className = 'toast';
  box.textContent = msg;
  live.replaceChildren(box);
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { live.replaceChildren(); }, 2600);
}
var MSG = {
  pdf: ['The PDF is generated by the real system. Not part of the prototype.', 'আসল সিস্টেম PDF বানাবে। প্রোটোটাইপে নেই।'],
  revise: ['Revision request sent to Arif Rahman.', 'আরিফ রহমানকে সংশোধনের অনুরোধ পাঠানো হয়েছে।'],
  export: ['Excel export comes with the real system.', 'Excel এক্সপোর্ট আসল সিস্টেমে থাকবে।'],
  mushak66: ['Upload of Mushak-6.6 comes with the real system.', 'মূসক-৬.৬ আপলোড আসল সিস্টেমে থাকবে।'],
  soon: ['This section is not in the prototype.', 'এই অংশ প্রোটোটাইপে নেই।'],
  confirm: ['Order confirmed and sent to the Dhaka warehouse.', 'অর্ডার নিশ্চিত হয়ে ঢাকা গুদামে গেছে।'],
  paid: ['Payment marked received. Logged with your name.', 'পেমেন্ট এসেছে বলে চিহ্নিত। আপনার নামে লগ হয়েছে।'],
  ship: ['Handed to Sundarban Courier. The buyer gets an SMS.', 'সুন্দরবন কুরিয়ারে দেওয়া হয়েছে। ক্রেতা SMS পাবেন।']
};

function addToCart(sku, qty) {
  if (!own(P, sku)) return;
  qty = Math.max(1, qty | 0);
  var p = P[sku]; if (p.pack > 1 && qty % p.pack) qty = Math.ceil(qty / p.pack) * p.pack;
  var line = S.cart.filter(function (l) { return l.sku === sku; })[0];
  if (line) line.qty += qty; else S.cart.push({ sku: sku, qty: qty });
  render();
  toast(L('Added', 'যোগ হয়েছে') + ' ' + num(qty) + ' × ' + sku);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go],[data-act],[data-lang],[data-skin-pick]');
  if (!t) return;
  if (t.hasAttribute('data-skin-pick')) {
    var sv = t.getAttribute('data-skin-pick');
    if (sv === 'light' || sv === 'glass') {
      skin = sv;
      try { localStorage.setItem('mw-proto-skin', skin); } catch (err) {}
      render();
    }
    return;
  }
  if (t.hasAttribute('data-lang')) {
    lang = t.getAttribute('data-lang');
    try { localStorage.setItem('mw-proto-lang', lang); } catch (err) {}
    render(); return;
  }
  if (t.hasAttribute('data-go')) { e.preventDefault(); go(t.getAttribute('data-go')); return; }
  var a = t.getAttribute('data-act');
  if (a === 'add') {
    var from = t.getAttribute('data-qty-from');
    var q = from ? parseInt(document.getElementById(from).value, 10) : parseInt(t.getAttribute('data-qty'), 10);
    addToCart(t.getAttribute('data-sku'), q || 1);
  } else if (a === 'toggle-filters') { S.filtersOpen = !S.filtersOpen; render(); }
  else if (a === 'clear-filters') { S.filters = { mfr: {}, supply: {}, comms: {}, di: {}, instock: false }; render(); }
  else if (a === 'validate') { S.quickText = document.getElementById('quick-text').value; S.quickRows = parseQuick(S.quickText); render(); toast(L('List checked', 'তালিকা যাচাই হয়েছে')); }
  else if (a === 'swap') {
    if (!own(P, t.getAttribute('data-from')) || !own(P, t.getAttribute('data-to'))) return;
    S.quickText = S.quickText.split('\n').map(function (l) { return l.indexOf(t.getAttribute('data-from')) === 0 ? l.replace(t.getAttribute('data-from'), t.getAttribute('data-to')) : l; }).join('\n');
    S.quickRows = parseQuick(S.quickText); render();
  } else if (a === 'quick-to-cart') {
    var n = 0;
    S.quickRows.forEach(function (r) { if (r.sku && r.st !== 'disc') { var ln = S.cart.filter(function (l) { return l.sku === r.sku; })[0]; if (ln) ln.qty += r.adj; else S.cart.push({ sku: r.sku, qty: r.adj }); n++; } });
    toast(num(n) + ' ' + L('lines added to cart', 'টি লাইন কার্টে যোগ হয়েছে')); go('cart');
  } else if (a === 'remove') { S.cart.splice(+t.getAttribute('data-i'), 1); render(); }
  else if (a === 'submit-approval') { S.approvals[0].status = 'pending'; S.apSel = 0; toast(L('Sent to Rafiq Hasan. Stock is held for 24 hours.', 'রফিক হাসানকে পাঠানো হয়েছে। স্টক ২৪ ঘণ্টা ধরে রাখা হলো।')); go('approvals'); }
  else if (a === 'place') { toast(L('Order placed.', 'অর্ডার দেওয়া হয়েছে।')); go('company'); }
  else if (a === 'ap-sel') { S.apSel = +t.getAttribute('data-i'); S.apError = ''; render(); }
  else if (a === 'ap-approve') { var r = S.approvals[S.apSel]; r.status = 'approved'; S.apError = ''; render(); toast(L('Approved', 'অনুমোদিত')); }
  else if (a === 'ap-reject') {
    var r2 = S.approvals[S.apSel];
    if (!r2.reason.trim()) { S.apError = L('Write a short reason so the requester knows what to change.', 'অনুরোধকারী যেন বোঝেন কী বদলাতে হবে, তাই ছোট একটা কারণ লিখুন।'); render(); var ta = document.getElementById('ap-reason'); if (ta) ta.focus(); return; }
    r2.status = 'rejected'; S.apError = ''; render(); toast(L('Rejected', 'বাতিল করা হয়েছে'));
  } else if (a === 'ap-undo') { S.approvals[S.apSel].status = 'pending'; render(); }
  else if (a === 'co-filter') { var fk = t.getAttribute('data-k'); if (['all', 'new', 'unpaid', 'approval', 'picking', 'shipped', 'cancelled'].indexOf(fk) >= 0) { S.coFilter = fk; render(); } }
  else if (a === 'co-sel') { S.coSel = +t.getAttribute('data-i'); render(); }
  else if (a === 'pl-approve') { if (S.plAck) { S.plStatus = 'approved'; render(); toast(L('Price list approved', 'প্রাইস লিস্ট অনুমোদিত')); } }
  else if (a === 'pl-return') { S.plStatus = 'returned'; render(); }
  else if (a === 'pl-undo') { S.plStatus = 'pending'; S.plAck = false; render(); }
  else if (a === 'toast') { var mk = t.getAttribute('data-msg'); if (own(MSG, mk)) toast(L(MSG[mk][0], MSG[mk][1])); }
});
document.addEventListener('submit', function (e) {
  if (e.target.getAttribute('data-act') === 'search') { e.preventDefault(); go('products'); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t === sel) { go(sel.value); return; }
  if (t.hasAttribute('data-filter')) {
    var g = t.getAttribute('data-filter');
    var fkey = t.getAttribute('data-key');
    if (g === 'instock') S.filters.instock = t.checked;
    else if (['mfr', 'supply', 'comms', 'di'].indexOf(g) >= 0 && fkey && fkey !== '__proto__' && fkey !== 'constructor' && fkey !== 'prototype') S.filters[g][fkey] = t.checked;
    render(); return;
  }
  if (t.hasAttribute('data-cart-qty')) {
    var i = +t.getAttribute('data-cart-qty'), l = S.cart[i], p = P[l.sku], v = Math.max(1, parseInt(t.value, 10) || 1);
    if (p.pack > 1 && v % p.pack) { v = Math.ceil(v / p.pack) * p.pack; toast(L('Rounded up to a full box of', 'পুরো বাক্সে বাড়ানো হলো:') + ' ' + num(p.pack)); }
    l.qty = v; render(); return;
  }
  if (t.id === 'pdp-qty') { S.pdpQty = Math.max(1, parseInt(t.value, 10) || 1); render(); return; }
  if (t.id === 'csv-file' && t.files && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { S.quickText = String(fr.result).slice(0, 20000); S.quickRows = parseQuick(S.quickText); render(); };
    fr.readAsText(t.files[0]); return;
  }
  var b = t.getAttribute('data-bind');
  if (['costCentre', 'po', 'site', 'pay', 'vds', 'plAck'].indexOf(b) >= 0) { S[b] = t.type === 'checkbox' ? t.checked : t.value; render(); }
});
document.addEventListener('input', function (e) {
  if (e.target.hasAttribute('data-ap-reason')) S.approvals[S.apSel].reason = e.target.value;
  if (e.target.id === 'quick-text') S.quickText = e.target.value;
});
document.getElementById('prev-btn').addEventListener('click', function () { var i = idx(current); if (i > 0) go(SCREENS[i - 1].id); });
document.getElementById('next-btn').addEventListener('click', function () { var i = idx(current); if (i < SCREENS.length - 1) go(SCREENS[i + 1].id); });
document.getElementById('notes-btn').addEventListener('click', function () { notesOpen = !notesOpen; renderChrome(); });

var start = location.hash.slice(1);
current = VIEWS.has(start) ? start : 'home';
render();
})();
</script>
