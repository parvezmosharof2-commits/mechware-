version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mechware_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse_secret
      POSTGRES_DB: shopverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse -d shopverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mechware_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: mechware_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: meili_master_key_12345
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: mechware_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mechware_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minio_admin minio_secret_password;
      /usr/bin/mc mb --ignore-existing localminio/mechware-public;
      /usr/bin/mc mb --ignore-existing localminio/mechware-private-kyc;
      /usr/bin/mc anonymous set download localminio/mechware-public;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: mechware_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: mechware_imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: 94a0f44779a9
      IMGPROXY_SALT: 94a0f44779a9
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
