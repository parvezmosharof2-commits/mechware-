name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '23 3 * * 1'   # weekly, catches newly published advisories on unchanged code

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ csharp, javascript-typescript ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # Blocking: any secret in the git history fails the run. Reviewed false positives live in .gitleaksignore with a reason.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar xzf gitleaks.tgz gitleaks

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  # Blocking since sprint 0: any finding fails the run. The findings are printed in the log (the first report-only
  # runs wrote them only to SARIF, so they could not be read without code-scanning access) and uploaded to
  # Security -> Code scanning. A reviewed false positive is silenced in the code with a `nosemgrep: <rule-id>`
  # comment that says why.
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan
        run: >
          semgrep scan
          --config p/csharp --config p/typescript --config p/owasp-top-ten
          --exclude 'frontend/apps/web/public/seed-media' --exclude '**/Migrations/**'
          --text --sarif-output=semgrep.sarif --error
          backend/src frontend/apps frontend/packages

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Trivy covers what the npm/NuGet audit does not: misconfigured Dockerfiles / compose / IaC and secrets in the working
  # tree. Blocking since sprint 0 on HIGH / CRITICAL; findings are printed as a table and uploaded as SARIF.
  trivy:
    name: Config and dependency scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Trivy from the official apt repository
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy

      - name: Scan the repository (SARIF for code scanning)
        run: >
          trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --skip-dirs frontend/apps/web/public/seed-media
          --format sarif --output trivy.sarif .

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Fail on HIGH / CRITICAL findings (printed as a table)
        run: >
          trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --skip-dirs frontend/apps/web/public/seed-media
          --format table --exit-code 1 .

  dependency-audit:
    name: Dependency Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet packages (direct + transitive) have no known vulnerabilities
        run: |
          dotnet restore backend/ShopVerse.sln
          dotnet list backend/ShopVerse.sln package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: npm packages have no high/critical advisories
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
