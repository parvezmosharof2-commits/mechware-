version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: [ "Microsoft.*", "System.*", "Npgsql*" ]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: [ "next", "react", "react-dom", "eslint-config-next", "@next/*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
